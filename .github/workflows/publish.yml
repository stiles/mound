name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean workspace
        run: rm -rf dist/ build/ ./*.egg-info/

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: |
          python -m build
          ls -l dist/

      # The tag is the source of truth for what is being released. Building a
      # tree whose version says something else ships the wrong number under the
      # right tag, and PyPI will not let it be replaced.
      - name: Check the build matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*mound-(.*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          test "$tag" = "$built"

      - name: Check metadata
        run: twine check dist/*

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose dist/*
